<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องตั้งสายกีตาร์และเบส (มีเข็มวัด + เลือกสาย + ล็อกค่า)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #tuner-panel {
            background-color: #262626;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 380px;
        }
        .control-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        select, button {
            padding: 12px;
            font-size: 15px;
            border-radius: 10px;
            border: 1px solid #444;
            background-color: #333;
            color: white;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }
        select:focus, button:hover {
            border-color: #4caf50;
        }
        #start-btn {
            background-color: #388e3c;
            font-weight: bold;
            font-size: 16px;
            border: none;
            margin-bottom: 15px;
            width: 100%;
        }
        #start-btn:hover {
            background-color: #2e7d32;
        }
        #hold-btn {
            background-color: #d32f2f;
            border: none;
            font-weight: bold;
        }
        #hold-btn.locked {
            background-color: #ff9800;
        }
        #gauge-canvas {
            width: 100%;
            height: 180px;
            margin-top: 10px;
        }
        #note-display {
            font-size: 72px;
            font-weight: bold;
            color: #4caf50;
            margin: 5px 0;
            line-height: 1;
        }
        #pitch-display {
            font-size: 20px;
            color: #b0bec5;
            margin-bottom: 15px;
        }
        #status {
            font-size: 16px;
            padding: 10px;
            border-radius: 8px;
            background-color: #333;
            font-weight: 500;
        }
        .status-in-tune { color: #4caf50; }
        .status-flat { color: #ff9800; }
        .status-sharp { color: #f44336; }
    </style>
</head>
<body>

    <div id="tuner-panel">
        <button id="start-btn" onclick="toggleAudio()">เปิดไมโครโฟน</button>

        <div class="control-group">
            <!-- ตัวเลือกชนิดเครื่องดนตรี -->
            <select id="instrument-select" onchange="changeInstrument()">
                <option value="chromatic">โหมด Chromatic (ตรวจจับโน้ตให้อัตโนมัติ)</option>
                <option value="bass4">เบส 4 สาย (Standard: E A D G)</option>
                <option value="bass5">เบส 5 สาย (Standard: B E A D G)</option>
                <option value="guitar">กีตาร์ (Standard: E A D G B E)</option>
            </select>

            <!-- ตัวเลือกเจาะจงสาย/โน้ต -->
            <select id="target-note-select" disabled>
                <option value="auto">-- เลือกสายที่ต้องการตั้ง --</option>
            </select>

            <!-- ปุ่มล็อกค่า -->
            <button id="hold-btn" onclick="toggleHold()" disabled>🔒 ล็อกค่าที่วัดได้ (Hold)</button>
        </div>

        <!-- หน้าปัดเข็มวัด -->
        <canvas id="gauge-canvas" width="300" height="180"></canvas>

        <div id="note-display">-</div>
        <div id="pitch-display">0.0 Hz</div>
        <div id="status">สถานะ: รอรับเสียง</div>
    </div>

    <script>
        // ข้อมูลโน้ตมาตรฐานของแต่ละเครื่องดนตรี
        const presets = {
            chromatic: [],
            bass4: [
                { name: "สาย 4: E1 (41.2 Hz)", note: 28 },
                { name: "สาย 3: A1 (55.0 Hz)", note: 33 },
                { name: "สาย 2: D2 (73.4 Hz)", note: 38 },
                { name: "สาย 1: G2 (98.0 Hz)", note: 43 }
            ],
            bass5: [
                { name: "สาย 5: B0 (30.9 Hz)", note: 23 },
                { name: "สาย 4: E1 (41.2 Hz)", note: 28 },
                { name: "สาย 3: A1 (55.0 Hz)", note: 33 },
                { name: "สาย 2: D2 (73.4 Hz)", note: 38 },
                { name: "สาย 1: G2 (98.0 Hz)", note: 43 }
            ],
            guitar: [
                { name: "สาย 6: E2 (82.4 Hz)", note: 40 },
                { name: "สาย 5: A2 (110.0 Hz)", note: 45 },
                { name: "สาย 4: D3 (146.8 Hz)", note: 50 },
                { name: "สาย 3: G3 (196.0 Hz)", note: 55 },
                { name: "สาย 2: B3 (246.9 Hz)", note: 59 },
                { name: "สาย 1: E4 (329.6 Hz)", note: 64 }
            ]
        };

        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        let audioContext = null;
        let analyser = null;
        let isRunning = false;
        let isLocked = false;

        const canvas = document.getElementById('gauge-canvas');
        const ctx = canvas.getContext('2d');

        // ฟังก์ชันเปลี่ยนรายการสายตามเครื่องดนตรีที่เลือก
        function changeInstrument() {
            const inst = document.getElementById('instrument-select').value;
            const targetSelect = document.getElementById('target-note-select');
            targetSelect.innerHTML = '<option value="auto">-- ตรวจจับสายให้อัตโนมัติ --</option>';

            if (inst === 'chromatic') {
                targetSelect.disabled = true;
            } else {
                targetSelect.disabled = false;
                presets[inst].forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.note;
                    opt.innerText = item.name;
                    targetSelect.appendChild(opt);
                });
            }
        }

        // ฟังก์ชันล็อก/ปลดล็อกค่าหน้าจอ (Hold)
        function toggleHold() {
            isLocked = !isLocked;
            const btn = document.getElementById('hold-btn');
            if (isLocked) {
                btn.classList.add('locked');
                btn.innerText = "🔓 ปลดล็อกค่า (Resume)";
            } else {
                btn.classList.remove('locked');
                btn.innerText = "🔒 ล็อกค่าที่วัดได้ (Hold)";
            }
        }

        // เปิด/ปิด การใช้งานไมโครโฟน
        async function toggleAudio() {
            const startBtn = document.getElementById('start-btn');
            const holdBtn = document.getElementById('hold-btn');

            if (!isRunning) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 4096; // เพิ่ม Buffer เป็น 4096 เพื่อจับเสียงต่ำเบส (B0/E1) ได้แม่นยำขึ้น

                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const source = audioContext.createMediaStreamSource(stream);
                    source.connect(analyser);

                    isRunning = true;
                    startBtn.innerText = "ปิดไมโครโฟน";
                    startBtn.style.backgroundColor = "#d32f2f";
                    holdBtn.disabled = false;

                    updatePitch();
                } catch (err) {
                    alert("ไม่สามารถเข้าถึงไมโครโฟนได้: " + err.message);
                }
            } else {
                if (audioContext) audioContext.close();
                isRunning = false;
                startBtn.innerText = "เปิดไมโครโฟน";
                startBtn.style.backgroundColor = "#388e3c";
                holdBtn.disabled = true;
                if (isLocked) toggleHold();
            }
        }

        // คำนวณความถี่จากคลื่นเสียง (Auto-correlation)
        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length;
            let rms = 0;
            for (let i = 0; i < SIZE; i++) {
                let val = buf[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.01) return -1; // เสียงเบาเกินไป

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++)
                if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            for (let i = 1; i < SIZE / 2; i++)
                if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

            buf = buf.slice(r1, r2);
            SIZE = buf.length;

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++)
                for (let j = 0; j < SIZE - i; j++)
                    c[i] = c[i] + buf[j] * buf[j + i];

            let d = 0; while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;
            return sampleRate / T0;
        }

        function noteFromPitch(frequency) {
            const noteNum = 12 * (Math.log(frequency / 440) / Math.log(2));
            return Math.round(noteNum) + 69;
        }

        function frequencyFromNoteNumber(note) {
            return 440 * Math.pow(2, (note - 69) / 12);
        }

        function centsOffFromPitch(frequency, note) {
            return Math.floor(1200 * Math.log(frequency / frequencyFromNoteNumber(note)) / Math.log(2));
        }

        // วาดเข็มวัดบน Canvas
        function drawGauge(cents) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height - 25;
            const radius = 110;

            // วาดโค้งสเกล
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, Math.PI, 0);
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 12;
            ctx.stroke();

            // ขีดตรงกลาง (ตรงคีย์)
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - radius - 8);
            ctx.lineTo(centerX, centerY - radius + 8);
            ctx.strokeStyle = '#4caf50';
            ctx.lineWidth = 4;
            ctx.stroke();

            // คำนวณมุมเข็ม (-50 cents ถึง +50 cents)
            const clampedCents = Math.max(-50, Math.min(50, cents));
            const angle = (clampedCents / 50) * (Math.PI / 3); 

            // กำหนดสีเข็มตามความเพี้ยน
            let needleColor = '#ffffff';
            if (Math.abs(cents) <= 5) needleColor = '#4caf50'; // ตรงคีย์ (สีเขียว)
            else if (cents < 0) needleColor = '#ff9800';      // เสียงต่ำ (สีส้ม)
            else needleColor = '#f44336';                     // เสียงสูง (สีแดง)

            // วาดตัวเข็ม
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -radius + 5);
            ctx.strokeStyle = needleColor;
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.restore();

            // วาดจุดหมุนเข็ม
            ctx.beginPath();
            ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
            ctx.fillStyle = needleColor;
            ctx.fill();
        }

        // ลูปประมวลผลความถี่เสียง
        function updatePitch() {
            if (!isRunning) return;

            // ตรวจสอบว่าได้กด "ล็อกค่า (Hold)" อยู่หรือไม่
            if (!isLocked) {
                const buffer = new Float32Array(4096);
                analyser.getFloatTimeDomainData(buffer);
                const pitch = autoCorrelate(buffer, audioContext.sampleRate);

                const noteDisplay = document.getElementById('note-display');
                const pitchDisplay = document.getElementById('pitch-display');
                const statusDisplay = document.getElementById('status');
                const targetSelectValue = document.getElementById('target-note-select').value;

                if (pitch !== -1) {
                    let noteNumber;
                    
                    // ถ้าเลือกสายเจาะจงไว้ ให้ใช้นั้นเป็นเป้าหมาย แต่ถ้าเลือก Auto ให้หาคีย์เอง
                    if (targetSelectValue !== 'auto') {
                        noteNumber = parseInt(targetSelectValue);
                    } else {
                        noteNumber = noteFromPitch(pitch);
                    }

                    const noteName = noteNames[noteNumber % 12];
                    const cents = centsOffFromPitch(pitch, noteNumber);

                    noteDisplay.innerText = noteName;
                    pitchDisplay.innerText = pitch.toFixed(1) + " Hz";

                    drawGauge(cents);

                    if (Math.abs(cents) <= 5) {
                        statusDisplay.innerText = "ตรงคีย์แล้ว! (In Tune)";
                        statusDisplay.className = "status-in-tune";
                    } else if (cents < 0) {
                        statusDisplay.innerText = `เสียงต่ำไป (${cents} Cents)`;
                        statusDisplay.className = "status-flat";
                    } else {
                        statusDisplay.innerText = `เสียงสูงไป (+${cents} Cents)`;
                        statusDisplay.className = "status-sharp";
                    }
                }
            }

            requestAnimationFrame(updatePitch);
        }

        // วาดหน้าปัดเริ่มต้น
        drawGauge(0);
    </script>
</body>
</html>
